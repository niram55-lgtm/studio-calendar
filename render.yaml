services:
  - type: web
    name: studio-calendar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: SCHEDULER_ENABLED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/
      sizeGB: 1
